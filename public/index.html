<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Finder</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Study Finder</a>
    <form id="search-form" class="search" role="search">
      <input id="q" name="q" type="search" placeholder="Search a topic: distributed systems, học máy, CS229…" autocomplete="off" maxlength="100" aria-label="Keyword"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
      <button type="submit">Search</button>
      <ul id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
    </form>
    <span id="rate" class="rate" title="GitHub search budget"></span>
    <button id="theme" type="button" class="theme-toggle" aria-label="Theme: auto" title="Theme: auto">◐</button>
  </header>

  <div id="history" class="history" aria-label="Recent searches"></div>

  <main class="layout">
    <aside id="filters" class="filters" aria-label="Filters" hidden>
      <div class="filters-head">
        <strong>Filters</strong>
        <button id="reset-filters" type="button" class="link">Reset</button>
      </div>
      <fieldset><legend>University</legend><div id="f-university"></div></fieldset>
      <fieldset><legend>Type</legend><div id="f-type"></div></fieldset>
      <fieldset><legend>Level</legend><div id="f-level"></div></fieldset>
      <fieldset><legend>Language</legend><div id="f-lang"></div></fieldset>
      <fieldset>
        <legend>Repository</legend>
        <label class="row">Min stars <input id="f-stars" type="number" min="0" step="10" value="0"></label>
        <label class="row">Updated
          <select id="f-updated">
            <option value="0">any time</option>
            <option value="1">last year</option>
            <option value="3">last 3 years</option>
          </select>
        </label>
        <label class="check"><input id="f-official" type="checkbox"> Official only</label>
        <label class="check"><input id="f-solutions" type="checkbox" checked> Hide solution repos</label>
      </fieldset>
    </aside>

    <section class="results" aria-live="polite">
      <div id="toolbar" class="toolbar" hidden>
        <button id="toggle-filters" type="button" class="filters-toggle">Filters</button>
        <span id="summary" class="summary"></span>
        <label>Sort
          <select id="sort">
            <option value="score">Best match</option>
            <option value="stars">Stars</option>
            <option value="updated">Recently updated</option>
          </select>
        </label>
        <button id="refresh" type="button">Refresh</button>
        <details id="export-menu" class="menu">
          <summary class="button">Export</summary>
          <div class="menu-items">
            <a id="export-md" href="#" download>Markdown (.md)</a>
            <a id="export-csv" href="#" download>Spreadsheet (.csv)</a>
            <a id="export-json" href="#" download>Data (.json)</a>
          </div>
        </details>
      </div>
      <div id="uni-pills" class="pills" role="group" aria-label="Filter by university" hidden></div>
      <p id="queries" class="queries"></p>
      <div id="progress" class="progress" role="status" aria-live="polite" hidden>
        <div class="progress-text"></div>
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>
      <div id="banner"></div>
      <div id="content"></div>
    </section>
  </main>
</body>
</html>
